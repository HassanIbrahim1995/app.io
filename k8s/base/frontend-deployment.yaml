apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-frontend
  namespace: hotel-management
  labels:
    app: hotel-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hotel-frontend
  template:
    metadata:
      labels:
        app: hotel-frontend
    spec:
      containers:
      - name: hotel-frontend
        image: hotel-management/frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: hotel-frontend
  namespace: hotel-management
spec:
  selector:
    app: hotel-frontend
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP

apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-backend
  namespace: hotel-management
  labels:
    app: hotel-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hotel-backend
  template:
    metadata:
      labels:
        app: hotel-backend
    spec:
      containers:
      - name: hotel-backend
        image: hotel-management/backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: DATABASE_URL
          value: "jdbc:postgresql://postgres:5432/hotel_management"
        - name: DATABASE_USERNAME
          valueFrom:
            secretKeyRef:
              name: hotel-secrets
              key: database-user
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hotel-secrets
              key: database-password
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: hotel-secrets
              key: jwt-secret
        - name: STRIPE_API_KEY
          valueFrom:
            secretKeyRef:
              name: hotel-secrets
              key: stripe-api-key
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: hotel-backend
  namespace: hotel-management
spec:
  selector:
    app: hotel-backend
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP
